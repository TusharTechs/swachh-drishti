[project]
name = "swachh-drishti"
version = "0.1.0"
description = "Open satellite evidence for India's legacy dumpsites (Lakshya Zero Dumpsite)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "pystac-client>=0.8",
  "requests>=2.31",
  "pandas>=2.1",
  "pillow>=13.0.0",
  "osmium>=4.3.2",
  "anthropic>=2.8.0",
  "pydantic>=2.14.3",
  "scipy>=1.17.1",
  "hyp3-sdk>=7.7.8",
  "asf-search>=14.1.0",
]

[tool.uv]
package = false
