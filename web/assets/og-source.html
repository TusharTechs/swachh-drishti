<!doctype html>
<html><head><meta charset="utf-8"><title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Inter:wght@500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,sans-serif;color:#e9f5f2;background:radial-gradient(700px 380px at 82% 12%,rgba(45,212,191,.28),transparent 60%),radial-gradient(600px 300px at 5% 100%,rgba(242,153,74,.22),transparent 60%),linear-gradient(160deg,#0b2f2c,#071615);position:relative}

  p{font-size:25px;line-height:1.4;color:#c9dfda;margin:20px 0 26px;max-width:640px}
  .stats{display:flex;gap:14px}
  .s{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 18px}
  .s b{display:block;font:650 34px Fraunces,serif}.s span{font-size:15px;color:#b9d3cd}
  .url{position:absolute;right:70px;bottom:34px;font:600 17px Inter;color:#9fe7dc}
